version: "3.9"

services:

  api:
    build: .
    container_name: crc_api
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs   # mount checkpoints + results
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build: .
    container_name: crc_ui
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0